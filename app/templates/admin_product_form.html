{% extends 'base.html' %}
{% block title %}{{ 'Editar' if product else 'Nuevo' }} producto{% endblock %}
{% block content %}
<section class="admin-shell"><div class="admin-card"><span class="eyebrow">Catálogo interno</span><h1>{{ 'Editar producto' if product else 'Crear producto' }}</h1>
<form method="post" class="admin-form product-form"><input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
  <label>Código SKU<input name="sku" maxlength="32" required value="{{ product.sku if product else '' }}"></label>
  <label>Nombre<input name="name" maxlength="140" required value="{{ product.name if product else '' }}"></label>
  <label>Categoría relacionada<select name="category_id" required><option value="">Selecciona una categoría</option>{% for category in categories %}<option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label>
  <label>Presentación<input name="presentation" maxlength="80" value="{{ product.presentation if product else 'Unidad' }}"></label>
  <label>Existencias<input type="number" name="stock" min="0" required value="{{ product.stock if product else 0 }}"></label>
  <label>Stock mínimo<input type="number" name="min_stock" min="0" required value="{{ product.min_stock if product else 5 }}"></label>
  <label>Precio (S/)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '0.00' }}"></label>
  <label>Fecha de vencimiento<input type="date" name="expiry_date" value="{{ product.expiry_date.isoformat() if product and product.expiry_date else '' }}"></label>
  <div class="form-actions"><button class="admin-button" type="submit">Guardar producto</button><a class="admin-button secondary" href="{{ url_for('main.admin_products') }}">Cancelar</a></div>
</form></div></section>
{% endblock %}
