{% extends 'base.html' %}
{% block title %}Editar cita{% endblock %}
{% block content %}
<section class="admin-shell"><div class="admin-card"><span class="eyebrow">Administración</span><h1>Editar solicitud de cita</h1><p>Recibida el {{ item.created_at.strftime('%d/%m/%Y %H:%M') }}</p>
<form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
<label>Paciente<input name="patient_name" maxlength="140" required value="{{ request.form.get('patient_name', item.patient_name) }}"></label><label>Teléfono<input name="phone" maxlength="30" required value="{{ request.form.get('phone', item.phone) }}"></label><label>Servicio<select name="service" required>{% for service in services %}<option value="{{ service }}" {% if request.form.get('service', item.service) == service %}selected{% endif %}>{{ service }}</option>{% endfor %}</select></label>
<label>Horario preferido<input type="datetime-local" name="appointment_at" required value="{{ request.form.get('appointment_at', item.appointment_at.strftime('%Y-%m-%dT%H:%M')) }}"></label><label>Profesional<input name="professional" maxlength="100" required value="{{ request.form.get('professional', item.professional) }}"></label><label>Estado<input name="status" maxlength="20" required value="{{ request.form.get('status', item.status) }}"></label><label>Notas<textarea name="notes" rows="4" maxlength="300">{{ request.form.get('notes', item.notes or '') }}</textarea></label>
<div class="form-actions"><button class="admin-button" type="submit">Guardar cambios</button><a class="admin-button secondary" href="{{ url_for('main.admin_appointments') }}">Cancelar</a></div></form></div></section>
{% endblock %}
