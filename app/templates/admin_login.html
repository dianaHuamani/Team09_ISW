{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="admin-shell"><div class="admin-card admin-login">
  <span class="eyebrow">Área interna</span><h1>Iniciar sesión</h1><p>Accede para administrar el catálogo de productos.</p>
  <form method="post" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
    <label>Usuario<input name="username" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="admin-button" type="submit">Ingresar</button>
  </form>
  <a class="admin-back" href="{{ url_for('main.dashboard') }}">← Volver al sitio</a>
</div></section>
{% endblock %}
